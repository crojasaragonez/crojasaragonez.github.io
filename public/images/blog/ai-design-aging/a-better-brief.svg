<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" role="img" aria-labelledby="title desc">
  <title id="title">A specific brief changes what there is to design</title>
  <desc id="desc">Two fictional coffee labels. The generic label has a purple gradient bean and premium wording. The specific label uses planting rows, cooperative identification, and fields for the producer and harvest lot.</desc>
  <defs>
    <linearGradient id="bean" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b6a3ff"/><stop offset=".5" stop-color="#8058d0"/><stop offset="1" stop-color="#5ec4d6"/>
    </linearGradient>
  </defs>
  <rect width="640" height="520" fill="#f1eee5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="28" y="35" fill="#536356" font-size="12" letter-spacing="2">VISUAL PATTERN STUDIES / 02</text>
    <text x="28" y="71" fill="#203e31" font-size="27" font-weight="700">Give the design something to say.</text>
    <text x="28" y="109" fill="#536356" font-size="15">A style request</text>
    <text x="334" y="109" fill="#536356" font-size="15">A business with a story</text>
    <rect x="28" y="125" width="278" height="306" rx="6" fill="#171b2e"/>
    <rect x="334" y="125" width="278" height="306" rx="6" fill="#fdfbf3" stroke="#b2bdad"/>
    <g transform="translate(167 222) rotate(32)">
      <ellipse rx="37" ry="53" fill="url(#bean)"/>
      <path d="M0 -42 C-25 -12 24 12 0 42" fill="none" stroke="#171b2e" stroke-width="5"/>
    </g>
    <text x="167" y="316" fill="#f4f0ff" font-size="23" text-anchor="middle" letter-spacing="3">PREMIUM</text>
    <text x="167" y="344" fill="#c1bdd5" font-size="16" text-anchor="middle" letter-spacing="6">COFFEE</text>
    <path d="M127 366 H207" stroke="#71668d"/>
    <text x="167" y="396" fill="#c1bdd5" font-size="12" text-anchor="middle" letter-spacing="1">CRAFTED FOR EVERY DAY</text>
    <g stroke="#276047" stroke-width="4" fill="none">
      <path d="M359 224 L382 172 L405 224 M370 224 L382 197 L394 224"/>
      <path d="M405 224 L428 172 L451 224 M416 224 L428 197 L440 224"/>
      <path d="M451 224 L474 172 L497 224 M462 224 L474 197 L486 224"/>
      <path d="M497 224 L520 172 L543 224 M508 224 L520 197 L532 224"/>
    </g>
    <text x="358" y="263" fill="#203e31" font-size="24" font-weight="700">FINCA / COLECTIVA</text>
    <text x="358" y="287" fill="#536356" font-size="13" letter-spacing="1.2">COOPERATIVE COFFEE</text>
    <path d="M358 304 H588 M358 350 H588 M358 396 H588" stroke="#b2bdad"/>
    <text x="358" y="323" fill="#536356" font-size="10" letter-spacing="1.5">PRODUCER</text>
    <text x="358" y="342" fill="#203e31" font-size="14">[Producer name]</text>
    <text x="358" y="369" fill="#536356" font-size="10" letter-spacing="1.5">HARVEST / LOT</text>
    <text x="358" y="388" fill="#203e31" font-size="14">[Season] / [Lot number]</text>
    <text x="28" y="464" fill="#203e31" font-size="17">More context creates more meaningful choices.</text>
    <text x="28" y="494" fill="#536356" font-size="13">Fictional labels · A comparison of briefs, not a test of effectiveness</text>
  </g>
</svg>
