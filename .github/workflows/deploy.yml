name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Build (but do not deploy) pull requests, so a broken build never reaches main.
  pull_request:
  workflow_dispatch:

# Only the deploy job needs write access to Pages; the build job just reads code.
permissions:
  contents: read

# Let a running deployment finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # configure-pages needs these to enable the Pages site on a fresh repo.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Asserts Pages is enabled with the "GitHub Actions" source. Without this
      # the failure surfaces much later, as an opaque 404 from deploy-pages.
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # package.json requires >=22.12.0
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # upload-pages-artifact@v4 still embeds upload-artifact@v4 (Node 20).
      # Package the Pages-compatible tarball here and upload it with v5, which
      # runs on Node 24.
      - name: Package Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory dist \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v5
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    # Pull requests are build-only; nothing publishes from them.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
